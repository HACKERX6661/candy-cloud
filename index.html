<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Cloud Shop - Graz</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍭</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: gradient 15s ease infinite; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .shop-container { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; max-width: 450px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .graz-banner { background: #ff4444; color: white; padding: 5px; font-weight: bold; border-radius: 10px; margin-bottom: 15px; font-size: 14px; }
        .product-card { border: 1px solid #ddd; border-radius: 12px; margin-bottom: 12px; padding: 15px; display: flex; align-items: center; text-align: left; background: #fff; }
        .product-card img { width: 60px; height: 60px; border-radius: 8px; margin-right: 15px; object-fit: contain; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .buy-button { background: #e73c7e; color: white; padding: 15px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .step { display: none; }
        .step.active { display: block; }
        .card-save-box { display: flex; align-items: center; font-size: 12px; color: #666; margin-top: 5px; text-align: left; }
        .card-save-box input { width: auto; margin-right: 10px; }
    </style>
</head>
<body>

    <div id="captcha-gate" class="shop-container">
        <div class="graz-banner">📍 NUR GRAZ (8010-8055)</div>
        <h2>Sicherheit</h2>
        <div id="captchaCode" style="font-size:24px; font-weight:bold; margin:10px; background:#eee; padding:10px; letter-spacing:5px;"></div>
        <input type="text" id="captchaInput" placeholder="Captcha-Code">
        <label style="font-size:12px;"><input type="checkbox" id="agbCheck"> AGB akzeptieren (Graz/Kleinunternehmer)</label>
        <button onclick="checkCaptcha()" class="buy-button">Weiter zum Shop</button>
    </div>

    <div id="main-shop" class="shop-container" style="display: none;">
        <div class="graz-banner">Zustellung nur in Graz!</div>
        <h1>Candy Cloud</h1>
        <form id="orderForm">
            <div id="step1" class="step active">
                <div class="product-card">
                    <img src="Candy-Cloud/saure_strips.jpg">
                    <div style="flex-grow:1;"><strong>Saure Strips</strong><br>2,00 €</div>
                    <input type="checkbox" name="Strips" value="Ja" class="item-check" data-price="2.00">
                </div>
                <div class="product-card">
                    <img src="Candy-Cloud/prime.jpg">
                    <div style="flex-grow:1;"><strong>Prime Drink</strong><br>3,50 €</div>
                    <input type="checkbox" name="Prime" value="Ja" class="item-check" data-price="3.50">
                </div>
                <div class="product-card">
                    <img src="Candy-Cloud/takis.jpg">
                    <div style="flex-grow:1;"><strong>Takis Fuego</strong><br>2,50 €</div>
                    <input type="checkbox" name="Takis" value="Ja" class="item-check" data-price="2.50">
                </div>
                <button type="button" onclick="nextStep()" class="buy-button">Weiter zur Kasse</button>
            </div>

            <div id="step2" class="step">
                <h3>Sicherer Gang zur Kasse</h3>
                <input type="text" name="Kunde" placeholder="Vollständiger Name" required>
                <input type="email" name="Email" placeholder="E-Mail" required>
                <input type="text" name="Strasse" placeholder="Straße & Hausnummer" required>
                <input type="number" id="plzInput" name="PLZ" placeholder="PLZ (Graz)" required min="8010" max="8055">
                
                <div style="text-align: left; margin-top: 15px;">
                    <label style="font-weight: bold; font-size: 14px;">Zahlungsmethode:</label>
                    <select id="payMethod">
                        <option value="card">Kredit- oder Debitkarte</option>
                        <option value="paypal">Direkt mit PayPal</option>
                    </select>
                </div>

                <div class="card-save-box">
                    <input type="checkbox" checked>
                    <span>Für zukünftige Einkäufe sicher speichern</span>
                </div>

                <input type="hidden" id="totalAmount" name="GESAMTSUMME">
                <button type="button" id="submitBtn" onclick="processPayment()" class="buy-button">Jetzt Bestellen</button>
            </div>
        </form>
    </div>

    <script>
        let currentCaptcha;
        function genCaptcha() {
            currentCaptcha = Math.random().toString(36).substring(2, 7).toUpperCase();
            document.getElementById('captchaCode').innerText = currentCaptcha;
        }
        genCaptcha();

        function checkCaptcha() {
            if(document.getElementById('captchaInput').value.toUpperCase() === currentCaptcha && document.getElementById('agbCheck').checked) {
                document.getElementById('captcha-gate').style.display = 'none';
                document.getElementById('main-shop').style.display = 'block';
            } else { alert("Fehler!"); genCaptcha(); }
        }

        function nextStep() { document.getElementById('step1').classList.remove('active'); document.getElementById('step2').classList.add('active'); }

        async function processPayment() {
            const plz = document.getElementById('plzInput').value;
            if(plz < 8010 || plz > 8055) { alert("Nur Graz-Adressen möglich!"); return; }

            let summe = 2.50; 
            document.querySelectorAll('.item-check:checked').forEach(i => summe += parseFloat(i.dataset.price));
            const betrag = summe.toFixed(2);
            document.getElementById('totalAmount').value = betrag + " €";

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Sicher verschlüsselt...";
            btn.disabled = true;

            try {
                await fetch("https://formspree.io/f/mjgveeel", {
                    method: "POST",
                    body: new FormData(document.getElementById('orderForm')),
                    headers: { 'Accept': 'application/json' }
                });
                
                // Leitet zu PayPal weiter. Dort kann der Kunde "Kreditkarte" wählen
                // und die Karte für seinen Browser speichern.
                window.location.href = "https://paypal.me/AlenaGutsol/" + betrag;
            } catch (e) { alert("Fehler!"); btn.disabled = false; }
        }
    </script>
</body>
</html>
