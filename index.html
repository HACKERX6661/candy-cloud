<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Cloud Shop</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☁️</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: gradient 15s ease infinite; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .shop-container { background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 20px; max-width: 450px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
        .logo-header { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #e73c7e; margin-bottom: 10px; }
        .product-card { border: 1px solid #ddd; border-radius: 12px; margin-bottom: 12px; padding: 15px; display: flex; align-items: center; text-align: left; background: #fff; }
        .product-card img { width: 60px; height: 60px; border-radius: 8px; margin-right: 15px; object-fit: contain; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .address-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
        .buy-button { background: #e73c7e; color: white; padding: 15px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        .step { display: none; }
        .step.active { display: block; }
    </style>
</head>
<body>

    <div id="auth-gate" class="shop-container">
        <h2>🍭 Candy Cloud Login</h2>
        <input type="text" id="userEmail" placeholder="Deine E-Mail Adresse">
        <button onclick="sendCode()" class="buy-button">Code senden</button>
        <div id="code-section" style="display: none; margin-top: 20px;">
            <input type="text" id="inputCode" placeholder="Code eingeben">
            <button onclick="verifyCode()" class="buy-button" style="background: #23d5ab;">Shop öffnen</button>
        </div>
    </div>

    <div id="main-shop" class="shop-container" style="display: none;">
        <img src="Candy-Cloud/saure_strips.jpg" class="logo-header" alt="Logo">
        <h1>Candy Cloud</h1>
        
        <form id="orderForm">
            <div id="step1" class="step active">
                <div class="product-card">
                    <img src="Candy-Cloud/saure_strips.jpg">
                    <div style="flex-grow:1;"><strong>Saure Strips</strong><br>2,00 €</div>
                    <input type="checkbox" name="Strips" value="Ja" class="item-check" data-price="2.00">
                </div>
                <div class="product-card">
                    <img src="prime.jpg">
                    <div style="flex-grow:1;"><strong>Prime Drink</strong><br>3,50 €</div>
                    <input type="checkbox" name="Prime" value="Ja" class="item-check" data-price="3.50">
                </div>
                <div class="product-card">
                    <img src="takis.jpg">
                    <div style="flex-grow:1;"><strong>Takis Fuego</strong><br>2,50 €</div>
                    <input type="checkbox" name="Takis" value="Ja" class="item-check" data-price="2.50">
                </div>
                <button type="button" onclick="nextStep()" class="buy-button">Weiter zur Adresse</button>
            </div>

            <div id="step2" class="step">
                <h3>Lieferdaten</h3>
                <input type="text" name="Kunde" placeholder="Name" required>
                <input type="email" id="autoEmail" name="Email" readonly required style="background: #f9f9f9;">
                <input type="tel" name="Telefon" placeholder="Telefonnummer" required>
                <input type="text" name="Strasse" placeholder="Straße" required>
                <div class="address-grid">
                    <input type="text" name="PLZ" placeholder="PLZ" required>
                    <input type="text" name="Ort" placeholder="Ort" required>
                </div>
                <input type="hidden" id="totalAmount" name="GESAMTSUMME">
                <button type="button" id="submitBtn" onclick="calculateAndSend()" class="buy-button">Mit PayPal bezahlen</button>
                <button type="button" onclick="prevStep()" style="background:none; border:none; color:#666; cursor:pointer; margin-top:10px;">← Zurück zur Auswahl</button>
            </div>
        </form>
    </div>

    <script>
        (function() { emailjs.init("G5J0iTvi3DSK0C6p9"); })();
        let generatedCode, loginEmail;

        function openShop(email) {
            document.getElementById('auth-gate').style.display = 'none';
            document.getElementById('main-shop').style.display = 'block';
            document.getElementById('autoEmail').value = email;
        }

        function nextStep() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }

        function prevStep() {
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step1').classList.add('active');
        }

        function sendCode() {
            const inputVal = document.getElementById('userEmail').value;
            if (inputVal === "1986") { openShop("Admin-Test"); return; }
            loginEmail = inputVal;
            generatedCode = Math.floor(100000 + Math.random() * 900000);
            emailjs.send("service_ce5qg71", "template_3ucxs1x", { to_email: loginEmail, code: generatedCode })
                .then(() => { document.getElementById('code-section').style.display = 'block'; });
        }

        function verifyCode() {
            if(document.getElementById('inputCode').value == generatedCode) { openShop(loginEmail); }
        }

        async function calculateAndSend() {
            let summe = 2.50; 
            document.querySelectorAll('.item-check:checked').forEach(i => summe += parseFloat(i.dataset.price));
            const betrag = summe.toFixed(2);
            document.getElementById('totalAmount').value = betrag + " €";
            const btn = document.getElementById('submitBtn');
            btn.innerText = "Wird gesendet...";
            btn.disabled = true;

            try {
                await fetch("https://formspree.io/f/mjgveeel", {
                    method: "POST",
                    body: new FormData(document.getElementById('orderForm')),
                    headers: { 'Accept': 'application/json' }
                });
                window.location.href = "https://paypal.me/AlenaGutsol/" + betrag;
            } catch (error) {
                alert("Fehler.");
                btn.innerText = "Mit PayPal bezahlen";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
